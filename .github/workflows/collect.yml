name: collect

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch:
    inputs:
      month:
        description: "過去分を取り込む月 (YYYY-MM)。空なら直近7日間に出た記事（公表日は45日前まで）"
        required: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: range
        env:
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then
            [[ "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "month は YYYY-MM 形式で指定してください"; exit 1; }
            from="$MONTH-01"
            to=$(date -u -d "$from +1 month -1 day" +%F)
            article_from="$from"
          else
            # 記事は公表より遅れて出るので、公表日の範囲は45日、新しく出た記事は直近7日間を見る
            from=$(date -u -d '45 days ago' +%F)
            to=$(date -u +%F)
            article_from=$(date -u -d '7 days ago' +%F)
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "article_from=$article_from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"

      # 候補の列挙は Claude に任せず、スクリプトで機械的に行う（一覧の読み飛ばしやリンクの取りこぼしを防ぐ）
      - run: node scripts/list-candidates.mjs "${{ steps.range.outputs.from }}" "${{ steps.range.outputs.to }}" "${{ steps.range.outputs.article_from }}"

      # 公式発表の本文（PDF を含む）も先に取得してテキストにする。WebFetch は PDF を読めず、403 でも弾かれやすい
      - run: node scripts/fetch-official.mjs "${{ steps.range.outputs.to }}"

      # ターン数の上限などで失敗しても、保存済みのファイルは検証して push する（失敗は最後に再度報告する）
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 定期実行（cron）の実行者は、ワークフローを最後に更新したアクターになる。bot が更新したときも実行できるようにする
          allowed_bots: "chatora-bot"
          # Claude の途中経過と権限拒否をログに出す（公開ログ。機密は含まれない）
          show_full_output: true
          claude_args: >-
            --model sonnet
            --effort medium
            --max-turns 100
            --allowedTools "WebSearch,WebFetch,Glob,Grep,Read(data/**),Read(src/content.config.ts),Read(.candidates/**),Edit(data/**),Edit(/data/**),Write(data/**),Write(/data/**),Bash(pnpm build),Bash(node scripts/check-urls.mjs)"
            --disallowedTools "Agent"
          prompt: |
            あなたは日本の組織による情報漏洩事案のデータベースを更新する担当です。
            公表日が ${{ steps.range.outputs.from }} から ${{ steps.range.outputs.to }} までの事案を収集し、data/incidents/ に保存してください。

            ## 対象
            - 日本の企業・官公庁・自治体・大学・病院などが公表した情報漏洩（漏洩のおそれを含む）。
              不正アクセス、ランサムウェア、メール誤送信、紛失・盗難、内部不正、設定ミスなどすべて。
            - 海外企業は、日本法人が日本で公表したものに限る。
            - 攻撃者の主張やリーク情報だけで、組織が公式に公表していないものは対象外。

            ## 情報源
            事案の候補は、ScanNetSecurity の月別一覧と Google ニュースの検索から列挙済みです（下の「手順」を参照）。公式発表の URL が分からない候補は、WebSearch で探してください。
            ただしニュース記事は事案を見つけるためだけに使い、reports[].url には必ず当該組織の公式発表（プレスリリース・お知らせ・PDF）の URL を入れてください。
            公式発表の中身を、取得済みの本文ファイル（`links[].fetch.file`）または WebFetch で実際に確認できなかった事案は保存しないでください。

            ## 手順
            1. 候補は、ScanNetSecurity の月別一覧と Google ニュースの検索から、機械的に列挙済みです。`.candidates/index.txt` を、先頭から最後まで 200 行ずつ Read してください（1行1候補、タブ区切り。列は「番号・記事の日付・情報源（S=ScanNetSecurity、G=Google ニュース）・題名・取得済みの本文ファイル・公式発表の候補 URL」）。並びは、ScanNetSecurity の候補（範囲内の日付の記事、範囲より後の日付の記事の順）、最後に Google ニュース由来です。全行を読み終えてから、調べる候補を決めてください。一覧を自分で読み直す必要はありません。詳細（記事の冒頭 `excerpt`、`links`、`alsoReportedBy` など）が必要な候補は、番号を使って `.candidates/detail/<番号>.json` を Read してください。`.candidates/candidates.json` は数千行あるので、読まないでください。
               - `articleDate` は記事が出た日で、組織が公表した日ではありません。記事は公表より遅れて出るため、範囲より後の日付の記事も含まれています。公表日は、`excerpt`（「〇月〇日、〜を公表した」など）と、公式発表の中身で確認し、範囲内（上記の from〜to）のものだけを保存してください。範囲外の公表のものは候補から外します。
               - `source` が ScanNetSecurity の候補は、`links` に公式発表の URL があります。Google ニュース由来の候補は `links` が空で、`articleUrl` は転送用なので WebFetch しないでください。題名（媒体名を除いたもの）を手がかりに、公式発表を WebSearch で探します。
               - `links[].fetch.file` がある場合は、公式発表の本文を取得済みです。そのファイルを Read して内容（組織名・公表日・事実関係）を確認してください。WebFetch は不要です。
               - `links[].fetch` に `file` がない場合（HTTP エラー・通信エラー・本文なし）は、従来どおり WebFetch で試し、それでも確認できなければ WebSearch で別の URL を探します。
               - `links[].url` は、記事の「一次情報または関連リンク」に載っている URL です。`topPageOnly: true` のものは組織のトップページで、個別の公式発表ではありません。
            2. 題名から、対象外のもの（製品の脆弱性・パッチ、海外の事案、攻撃者の主張だけのもの）を除く。組織名で Grep して既存ファイルを確認し、すでに保存済みの同じ事案で、reports にない新しい公式発表（続報）も見当たらないものだけを除外する。同じ組織でも別の事案なら新規の候補として残し、続報があるものは既存ファイルへの追記対象として残す。
            3. 残った候補を処理する。公式発表の URL を持つ候補（ScanNetSecurity 由来で、`topPageOnly: false` のリンクがあるもの）を先に、公表日が新しい順で処理し、保存の上限やツール呼び出しの上限に余裕があれば、そのあとに Google ニュース由来の候補を処理する。
               1. `topPageOnly: false` の `links[]` の公式発表の中身（組織名・日付・事実関係）を、取得済みの本文ファイル（`fetch.file`）で確認する。確認できたら、その `url` を reports[].url にする。本文がなければ WebFetch で確認する。
               2. 候補の URL が開けない、または中身を確認できないとき、または `links` がトップページだけのときは、記事の題名や引用されている公式発表の正式なタイトルで WebSearch し、組織の公式ドメインの結果だけを採用する（探すための取得・検索は最大4回まで）。
               3. 公式発表を確認できなければ「保存しない」と決めて、すぐ次の候補へ進む。サイトや記事の URL（記事番号を含む）を推測して試すことはしない。

            ## 保存形式
            - スキーマは src/content.config.ts を読んで従うこと。分からない任意項目は推測で埋めず省略する。
            - 1事案1ファイル: data/incidents/<公表年>/<公表日>-<組織名の英字スラッグ>.json （例: data/incidents/2026/2026-03-14-example-corp.json）
            - publishedAt は第1報の公表日。title・summary は日本語で、事実のみを簡潔に書く。
            - 保存前に Grep で既存ファイルを組織名で検索し、同じ事案の続報なら新規作成せず既存ファイルの reports に追記して、件数などの項目を最新情報に更新する。

            ## 進め方
            サブエージェントは使わず、すべて自分で調査・保存まで行ってください。バックグラウンドで処理を任せて終了すると、保存されないまま実行が終わります。

            ## 1回の実行での上限
            ターン数の上限（100）に達すると実行が打ち切られ、検証が済んでいないファイルが残ります。次の上限を守ってください。
            - 1回の実行で新規に保存する事案は最大10件まで。
            - 公表日が新しい候補から順に処理する。調べる候補の数には上限を設けない。公式発表が見つからなかった候補は保存せず、すぐ次の候補へ進む。歯止めは、保存10件とツール呼び出し約70回の2つだけとする。
            - 公式発表を確認できた事案は、その場でただちに保存する（最後にまとめて保存しない）。
            - ツール呼び出しの合計が約70回に達したら、探索を打ち切って検証へ進む。検証と最終報告のために、残りのターンを必ず残しておく。
            - 保存が10件に達したら、探索を終えて検証へ進む。残りの事案は、同じ範囲で再実行されたときに追加される。
            - 保存前に Grep で既存ファイルを確認し、保存済みの事案は飛ばす（続報の追記は件数に数えない）。

            ## 検証
            保存し終えたら `pnpm build`（スキーマ検証）と `node scripts/check-urls.mjs`（URL 到達確認）を実行し、
            失敗したファイルは修正するか、直せなければ削除してください。両方成功するまで繰り返してください。

            ## 最終報告
            最後に、候補の総数と、調べた候補の数、保存した事案の一覧と、保存しなかった事案とその理由（公式発表が見つからなかった、公式発表の中身を確認できなかった、など）を表で出力してください。

      - run: pnpm build
      - run: pnpm check-urls

      - name: commit & push
        env:
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          git add data
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: ${FROM}〜${TO} の情報漏洩事案を更新"
          git push

      - name: Claude の実行失敗を報告
        if: steps.claude.outcome == 'failure'
        run: |
          echo "::error::Claude の実行が失敗しました（保存済みのファイルは検証して push 済み）。ログを確認してください。"
          exit 1
