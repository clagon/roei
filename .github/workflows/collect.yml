name: collect

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch:
    inputs:
      month:
        description: "過去分を取り込む月 (YYYY-MM)。空なら直近7日間"
        required: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: range
        env:
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then
            [[ "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "month は YYYY-MM 形式で指定してください"; exit 1; }
            from="$MONTH-01"
            to=$(date -u -d "$from +1 month -1 day" +%F)
          else
            from=$(date -u -d '7 days ago' +%F)
            to=$(date -u +%F)
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Claude の途中経過と権限拒否をログに出す（公開ログ。機密は含まれない）
          show_full_output: true
          claude_args: >-
            --model sonnet
            --effort medium
            --max-turns 100
            --allowedTools "WebSearch,WebFetch,Glob,Grep,Read(data/**),Read(src/content.config.ts),Edit(data/**),Write(data/**),Bash(pnpm build),Bash(node scripts/check-urls.mjs)"
            --disallowedTools "Agent"
          prompt: |
            あなたは日本の組織による情報漏洩事案のデータベースを更新する担当です。
            公表日が ${{ steps.range.outputs.from }} から ${{ steps.range.outputs.to }} までの事案を収集し、data/incidents/ に保存してください。

            ## 対象
            - 日本の企業・官公庁・自治体・大学・病院などが公表した情報漏洩（漏洩のおそれを含む）。
              不正アクセス、ランサムウェア、メール誤送信、紛失・盗難、内部不正、設定ミスなどすべて。
            - 海外企業は、日本法人が日本で公表したものに限る。
            - 攻撃者の主張やリーク情報だけで、組織が公式に公表していないものは対象外。

            ## 情報源
            Security NEXT (security-next.com)、piyolog (piyolog.hatenadiary.jp)、ITmedia NEWS などのセキュリティ系ニュースを巡回し、WebSearch で補完してください。
            ただしニュース記事は事案を見つけるためだけに使い、reports[].url には必ず当該組織の公式発表（プレスリリース・お知らせ・PDF）の URL を入れてください。
            WebFetch で公式発表の中身を実際に確認できなかった事案は保存しないでください。

            ## 手順
            1. 候補を先にすべて列挙する。Security NEXT の月別一覧（security-next.com/date/YYYY/MM）と ScanNetSecurity の月別一覧を、ページ送りして最後まで読み、「組織名・公表日・記事 URL」の一覧にまとめる。保存済みの組織は Grep で確認して、この時点で除外する。
            2. 候補ごとに、次の順で公式発表を探す。
               1. 報道記事を WebFetch するとき、「記事中の公式発表へのリンク（組織自身のドメインの URL）を、要約せず URL のまま全部列挙して」と指示する。
               2. 記事が引用している公式発表の正式なタイトル（「〜に関するお詫びとお知らせ」など）を、そのまま WebSearch の検索語にする。
               3. 組織名 + 「お知らせ」+ 事象（不正アクセス・誤送信など）で検索し、組織の公式ドメインの結果だけを採用する。
               4. 組織のお知らせ一覧ページ（ニュース・プレスリリースの一覧）を WebFetch し、該当する日付の項目を探す。
            3. 1候補につき、公式発表の探索は取得・検索を合わせて最大4回まで。見つからなければ「保存しない」と決めて次の候補へ進む。サイトの URL を推測して順に試すことはしない。

            ## 保存形式
            - スキーマは src/content.config.ts を読んで従うこと。分からない任意項目は推測で埋めず省略する。
            - 1事案1ファイル: data/incidents/<公表年>/<公表日>-<組織名の英字スラッグ>.json （例: data/incidents/2026/2026-03-14-example-corp.json）
            - publishedAt は第1報の公表日。title・summary は日本語で、事実のみを簡潔に書く。
            - 保存前に Grep で既存ファイルを組織名で検索し、同じ事案の続報なら新規作成せず既存ファイルの reports に追記して、件数などの項目を最新情報に更新する。

            ## 進め方
            サブエージェントは使わず、すべて自分で調査・保存まで行ってください。バックグラウンドで処理を任せて終了すると、保存されないまま実行が終わります。

            ## 1回の実行での上限
            ターン数の上限に達すると、保存したファイルも破棄されて実行全体が失敗します。そのため、1回の実行で新規に保存する事案は最大10件までにしてください。
            - 公表日が新しい事案から順に処理する。
            - 上限に達したら、それ以上は探さずに検証へ進む。残りの事案は、同じ範囲で再実行されたときに追加される。
            - 上限の10件に届かなくても、列挙した候補をすべて試してから検証へ進む。早く切り上げない。
            - 保存前に Grep で既存ファイルを確認し、保存済みの事案は飛ばす（続報の追記は件数に数えない）。

            ## 検証
            保存し終えたら `pnpm build`（スキーマ検証）と `node scripts/check-urls.mjs`（URL 到達確認）を実行し、
            失敗したファイルは修正するか、直せなければ削除してください。両方成功するまで繰り返してください。

            ## 最終報告
            最後に、保存した事案の一覧と、保存しなかった事案とその理由（公式発表が見つからなかった、公式発表の中身を確認できなかった、など）を表で出力してください。

      - run: pnpm build
      - run: pnpm check-urls

      - name: commit & push
        env:
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          git add data
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: ${FROM}〜${TO} の情報漏洩事案を更新"
          git push
